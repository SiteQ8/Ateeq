name: android-release

# Signs Ateeq with its upload key and sends it to the closed test track on Google Play, with
# the release notes in play/whatsnew, then refreshes the store listing from play/. Runs on an
# android-v tag (android-v1.0.0 becomes version 1.0.0) or by hand. Play only accepts uploads
# once the app's first bundle went in by hand, so until then the signed bundle waits in the
# run's artifacts. While the app has never been published, releases stay as drafts.
#
# Secrets: ANDROID_KEYSTORE (base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Version
        run: |
          echo "ATEEQ_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          V="${GITHUB_REF_NAME#android-v}"
          case "$V" in [0-9]*) echo "ATEEQ_VERSION_NAME=$V" >> "$GITHUB_ENV";; esac

      - name: Build and sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ATEEQ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATEEQ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATEEQ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ateeq-upload.p12"
          export ATEEQ_KEYSTORE="$RUNNER_TEMP/ateeq-upload.p12"
          cd android && chmod +x gradlew && ./gradlew --no-daemon :app:bundleRelease
          echo "version code $ATEEQ_VERSION_CODE"

      - uses: actions/upload-artifact@v4
        with:
          name: ateeq-android-release
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload to the closed test on Google Play
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet cryptography
          python3 tools/android/play-upload.py \
            --aab "$(ls android/app/build/outputs/bundle/release/*.aab | head -1)" \
            --track alpha --notes play/whatsnew | tee play.log

      - name: Store listing
        if: hashFiles('play/graphics/phone/ar/*.png') != ''
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          if grep -q "Play لا يعرف" play.log; then echo "no app on Play yet, listing waits"; exit 0; fi
          python3 tools/android/play-listing.py --keep-title

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/ateeq-upload.p12"
