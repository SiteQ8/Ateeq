# The Xcode project is generated, not committed:
#   sh tools/ios/sync-web.sh && brew install xcodegen && cd ios && xcodegen generate
name: Ateeq
options:
  bundleIdPrefix: com.eworldq8
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
targets:
  Ateeq:
    type: application
    platform: iOS
    sources:
      - path: Ateeq
      - path: Web
        type: folder
        buildPhase: resources
    info:
      path: Ateeq/Info.plist
      properties:
        CFBundleDisplayName: عتيق
        CFBundleName: Ateeq
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eworldq8.ateeq
        DEVELOPMENT_TEAM: FKZPXUFH45
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          # App Store signing arrives from the release workflow: the profile is created
          # by tools/ios/asc.py and passed in as ATEEQ_PROFILE.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(ATEEQ_PROFILE)
